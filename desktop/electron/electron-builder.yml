appId: com.bvisible.ssh-manager
productName: SSH Manager
copyright: Copyright © 2026 bvisible

directories:
  output: dist
  buildResources: resources

# Only this directory's own files go in the asar. The engine is carried as a
# resource instead — see extraResources — because ssh2 loads optional native
# bindings at runtime and those cannot be read from inside an archive.
files:
  - main.js
  - package.json
  # The menu-bar glyph is loaded at runtime from __dirname/resources, so it has
  # to be inside the asar with main.js. `resources` is also buildResources,
  # which electron-builder excludes by default — leaving the packaged app with
  # a Tray it cannot give an icon to, and therefore no menu bar item at all.
  - resources/trayTemplate.png
  - resources/trayTemplate@2x.png

extraResources:
  # Assembled by prepare-engine.mjs, which installs only the production
  # dependencies — pointing at the repository's node_modules put 55 MB of
  # eslint and friends inside the application.
  - from: engine
    to: engine
    filter:
      - '**/*'
      # node_modules has to be named explicitly. electron-builder's matcher
      # treats it specially — `**/*` does not reach into it — so without this
      # line the engine ships as bare source with no dependencies, and the app
      # dies on launch with "Cannot find package 'dotenv'". 30 MB became 2.2 MB
      # and nothing said so.
      - 'node_modules/**/*'
      - '!**/{test,tests,__tests__,example,examples,docs,doc}/**'
      - '!**/*.{md,map,ts}'
      - '!**/.bin/**'

  # node_modules needs its own entry. electron-builder never descends into a
  # directory called node_modules while copying an extraResource — with or
  # without a filter — so the engine shipped as bare source and the app died on
  # launch with "Cannot find package 'dotenv'". Naming the directory as the
  # *root* of a copy sidesteps the rule, because there is then nothing to
  # descend into.
  - from: engine/node_modules
    to: engine/node_modules
    filter:
      - '**/*'
      - '!**/{test,tests,__tests__,example,examples,docs,doc}/**'
      - '!**/*.{md,map,ts}'
      - '!**/.bin/**'

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Keychain access is what the vault uses on macOS; without the entitlement the
  # `security` call fails and the vault silently falls back to a key file.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Without a document type, the Dock icon refuses every drop and `open-file`
  # never fires. `public.item` is "any file or folder": this application does
  # not open documents, it sends them somewhere, so narrowing by extension
  # would only make it refuse the files people actually have.
  fileAssociations:
    - ext: '*'
      name: File
      role: Viewer
      rank: Alternate
  extendInfo:
    NSDownloadsFolderUsageDescription: SSH Manager reads and writes files here when you transfer them to or from a server.
    NSDocumentsFolderUsageDescription: SSH Manager reads and writes files here when you transfer them to or from a server.
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Uninstalling must not take the vault with it: the servers and their
  # encrypted credentials live in the user's home, not in the install directory,
  # and someone reinstalling expects to find them again.
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: bvisible
  artifactName: ${productName}-${version}-${arch}.${ext}
