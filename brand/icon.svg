<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SSH Manager">
  <title>SSH Manager</title>
  <!--
    The prompt and the spark: `>_` and the mark of what types into it.

    The chevron carries the accent because the product is an SSH manager first —
    that is what the wordmark says, and an icon arguing with its own logo is an
    icon nobody trusts. The sparks are white: present, not shouting.

    Stroke 34, not thinner. Below about 28 the bar starts to vanish at 16px, and
    a favicon that resolves to a dot is one shape short of a mark.

    The sparks sit above the baseline: the rising diagonal from chevron to spark
    is what gives the mark its movement, and a spark level with the prompt reads
    as another character in it rather than as something it produced.
  -->
  <rect width="512" height="512" rx="114" fill="#090909"/>
  <!-- Centred as a whole: the drawing measures 392×192 and sits with 60px of
       margin left and right, 160px top and bottom. Measured in a canvas rather
       than estimated — a round stroke cap and a curved star both extend past
       the coordinates they are drawn from, and the mark was 95px from one edge
       and 3px from the other before anybody checked. -->
  <g transform="translate(-35 19)">
    <path d="M112 164 L200 240 L112 316" fill="none" stroke="#c04500" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M228 316 L318 316" stroke="#fcfcfc" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(318 136) scale(5.8)" fill="#fcfcfc">
      <path d="M14.217,19.707l-1.112,2.547c-0.427,0.979-1.782,0.979-2.21,0l-1.112-2.547c-0.99-2.267-2.771-4.071-4.993-5.057	L1.73,13.292c-0.973-0.432-0.973-1.848,0-2.28l2.965-1.316C6.974,8.684,8.787,6.813,9.76,4.47l1.126-2.714	c0.418-1.007,1.81-1.007,2.228,0L14.24,4.47c0.973,2.344,2.786,4.215,5.065,5.226l2.965,1.316c0.973,0.432,0.973,1.848,0,2.28	l-3.061,1.359C16.988,15.637,15.206,17.441,14.217,19.707z"/>
      <path d="M24.481,27.796l-0.339,0.777c-0.248,0.569-1.036,0.569-1.284,0l-0.339-0.777c-0.604-1.385-1.693-2.488-3.051-3.092	l-1.044-0.464c-0.565-0.251-0.565-1.072,0-1.323l0.986-0.438c1.393-0.619,2.501-1.763,3.095-3.195l0.348-0.84	c0.243-0.585,1.052-0.585,1.294,0l0.348,0.84c0.594,1.432,1.702,2.576,3.095,3.195l0.986,0.438c0.565,0.251,0.565,1.072,0,1.323	l-1.044,0.464C26.174,25.308,25.085,26.411,24.481,27.796z"/>
    </g>
  </g>
</svg>
