<!doctype html>
<meta charset="utf-8">
<title>MCP SSH Manager — social preview</title>
<!-- The GitHub social preview (1280x640). Render with `npm run brand:social`; the font comes
     from the built interface (`npm run build:ui`) and the window is the README's own capture of
     the real application (docs/images/v4-waiting-app.png, made by the screenshot rig), cropped
     to the window and left to run off the right and bottom edges. -->
<style>
  @font-face { font-family: Karla; src: url("../dist/ui/assets/Karla-Variable.woff2") format("woff2"); font-weight: 200 800; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; }
  body { position: relative; overflow: hidden; background: #0f0f0e; color: #f3f0e8; font-family: Karla, system-ui, sans-serif; }

  .brand { position: absolute; left: 72px; top: 44px; display: flex; align-items: center; gap: 14px; }
  .brand .icon { width: 38px; height: 38px; border-radius: 9px; }
  .brand .word { height: 27px; }
  .meta { position: absolute; right: 72px; top: 55px; font-size: 17px; font-weight: 500; letter-spacing: .02em; color: #8b877e; }

  h1 { position: absolute; left: 68px; top: 108px; font-size: 82px; line-height: 1; font-weight: 650; letter-spacing: -.04em; }
  .sub { position: absolute; left: 72px; top: 208px; font-size: 26px; line-height: 1.2; font-weight: 400; letter-spacing: -.005em; color: #aaa59a; }

  /* The screenshot is 3056x1936 with the window at 88,88 and 2880x1760 inside it
     (a 1440x880 viewport at 2x, plus the shadow the framing script draws).
     --k maps those pixels to the width the window is shown at. */
  .app { --k: calc(1300 / 2880); position: absolute; left: 72px; top: 288px; width: 1300px; height: 700px; overflow: hidden; }
  .app img { position: absolute; display: block; width: calc(3056px * var(--k)); left: calc(-88px * var(--k)); top: calc(-88px * var(--k)); }
</style>
<div class="brand"><img class="icon" src="../docs/images/icon.png" alt=""><img class="word" src="../docs/images/wordmark-dark.png" alt="ssh manager"></div>
<div class="meta">macOS &nbsp;·&nbsp; Windows &nbsp;·&nbsp; Linux &nbsp;·&nbsp; MIT</div>
<h1>SSH for AI agents</h1>
<p class="sub">A desktop app and MCP server for Claude Code, Codex and any MCP client.</p>
<div class="app"><img src="../docs/images/v4-waiting-app.png" alt=""></div>
