name: Release desktop apps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact version tag for publication, or branch for a dry run.'
        required: true
      publish:
        description: 'Publish only after all platform checks pass. Off keeps CI artifacts only.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            build: npm run build:mac
          - os: windows-latest
            platform: win32
            build: npm run build:win
          - os: ubuntu-latest
            platform: linux
            build: npm run build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MAC_CERT: ${{ matrix.platform == 'darwin' && secrets.MAC_CERT_P12 || '' }}
      MAC_CERT_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CERT_PASSWORD || '' }}
      NOTARY_KEY: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_KEY || '' }}
      NOTARY_KEY_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_KEY_ID || '' }}
      NOTARY_ISSUER: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_ISSUER || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            desktop/electron/package-lock.json
      - name: Validate release versions
        id: version
        run: node scripts/release-version.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REQUIRE_TAG: ${{ inputs.publish }}
      - name: Install engine and interface
        run: npm ci && npm ci --prefix ui && npm run build --prefix ui
      - name: Require the committed interface to match its source
        run: git diff --exit-code -- dist/ui
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop/electron
      - name: Import the Developer ID certificate
        if: matrix.platform == 'darwin' && env.MAC_CERT != ''
        run: |
          echo "$MAC_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Write the notarization key
        if: matrix.platform == 'darwin' && env.NOTARY_KEY != ''
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      # Deliberately no GitHub token here: builders cannot publish artifacts.
      - name: Build without publishing
        working-directory: desktop/electron
        run: ${{ matrix.build }} -- --publish never
        env:
          APPLE_API_KEY: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_KEY != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'darwin' && secrets.APPLE_API_ISSUER || '' }}
          # Optional signing credentials supplied by the maintainer. A missing
          # credential is allowed in dry runs; Authenticode is checked below.
          WIN_CSC_LINK: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Notarize and staple each DMG
        if: matrix.platform == 'darwin' && env.NOTARY_KEY_ID != ''
        working-directory: desktop/electron
        run: |
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
      - name: Smoke test packaged macOS app
        if: matrix.platform == 'darwin'
        run: node scripts/smoke-desktop.mjs "desktop/electron/dist/mac-arm64/SSH Manager.app/Contents/MacOS/SSH Manager"
      # Run AFTER the smoke test: ordinary use must preserve the signature.
      - name: Verify macOS distribution
        if: matrix.platform == 'darwin' && (inputs.publish || env.MAC_CERT != '')
        run: |
          for app in desktop/electron/dist/mac*/*.app; do
            ./scripts/verify-mac-build.sh "$app"
            xcrun stapler validate "$app"
          done
          for dmg in desktop/electron/dist/*.dmg; do xcrun stapler validate "$dmg"; done
      - name: Smoke test packaged Windows app
        if: matrix.platform == 'win32'
        run: node scripts/smoke-desktop.mjs "desktop/electron/dist/win-unpacked/SSH Manager.exe"
      - name: Verify Windows distribution
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $required = '${{ inputs.publish }}' -eq 'true' -and '${{ steps.version.outputs.prerelease }}' -eq 'false'
          ./scripts/verify-windows-build.ps1 -RequireSigned:$required
      # The installer configures Chromium's sandbox and Ubuntu's AppArmor
      # profile. Starting the unpacked directory skips those required steps.
      - name: Install and smoke test packaged Linux app
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./desktop/electron/dist/*.deb
          xvfb-run -a node scripts/smoke-desktop.mjs "$(command -v ssh-manager-desktop)"
      - name: Finalize hashes and blockmaps after signing and stapling
        working-directory: desktop/electron
        run: node finalize-artifacts.mjs dist
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
      - name: Keep validated release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-${{ matrix.platform }}
          # Diagnostics share names across platforms and are outside the
          # release manifest, so they must not enter the merged download.
          path: |
            desktop/electron/dist/*.dmg
            desktop/electron/dist/*.zip
            desktop/electron/dist/*.exe
            desktop/electron/dist/*.AppImage
            desktop/electron/dist/*.deb
            desktop/electron/dist/*.blockmap
            desktop/electron/dist/*.yml
            !desktop/electron/dist/builder-*.yml
            desktop/electron/dist/release-manifest-*.json
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always() && matrix.platform == 'darwin'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Download validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p release-artifacts
          gh run download "$RUN_ID" --name validated-darwin --dir release-artifacts
          gh run download "$RUN_ID" --name validated-win32 --dir release-artifacts
          gh run download "$RUN_ID" --name validated-linux --dir release-artifacts
      - name: Verify hashes, upload to draft, then make release public
        run: node scripts/publish-desktop.mjs release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
