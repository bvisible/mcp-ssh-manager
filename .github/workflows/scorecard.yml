# OpenSSF Scorecard grades the repository's supply-chain posture (branch
# protection, pinned actions, token permissions, signed releases, dangerous
# workflow patterns...) and publishes the result as a public badge. For a server
# that hands an AI agent a root shell on production machines, that grade is part
# of the product: it is the answer to "can I trust this dependency".
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '31 6 * * 1'
  push:
    branches: [ main ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to the code-scanning dashboard.
      security-events: write
      # Needed to publish the results so the badge can read them.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
