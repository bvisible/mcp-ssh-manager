name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Least privilege: without this block the workflow gets the repository's default
# token scopes, which are far wider than needed. The validate job only needs to read the repository; trufflehog reads history.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        # Replaces the hand-rolled actions/cache step, whose key hashed a
        # package-lock.json that did not exist until it was committed — every
        # run shared one degenerate cache key.
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Run JavaScript syntax check
      run: |
        node --check src/index.js
        node --check src/ssh-manager.js

    - name: Run ESLint
      run: npm run lint

    # Type-checks the JSDoc annotations over plain JS (no build, nothing emitted).
    - name: Typecheck (JSDoc via tsc)
      run: npm run typecheck

    - name: Run knip (dead code & unused dependencies)
      run: npx knip

    # Advisory, not a required check: a CVE published against a transitive
    # dependency must be visible here without blocking unrelated merges on main.
    # The runtime tree is expected to stay at 0 vulnerabilities.
    - name: npm audit (runtime dependencies)
      run: npm audit --omit=dev --audit-level=high

    - name: Run validation script
      run: |
        chmod +x scripts/validate.sh
        ./scripts/validate.sh

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
      continue-on-error: true
