# Static analysis of the JavaScript we ship. Scorecard flags the absence of a
# SAST tool, and for a server that turns model output into shell commands on
# production hosts, "we read it carefully" is not an answer — injection sinks
# are exactly what a scanner is good at spotting.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '18 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          category: "/language:javascript-typescript"
