# Configure npm Trusted Publisher for this repository and release.yml. OIDC
# supplies provenance; NPM_TOKEN remains an optional fallback for npm auth.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact existing version tag (v4.0.0 or v4.0.0-rc.1).'
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Validate exact tag and all manifests
        id: version
        run: node scripts/release-version.mjs
        env:
          RELEASE_REQUIRE_TAG: 'true'
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Install dependencies
        run: npm ci && npm ci --prefix ui
      - name: Validate source, interface and bundled output
        run: |
          npm run test:all
          npm run build --prefix ui
          git diff --exit-code -- dist/ui
          node scripts/test-upgrade-from-published.mjs 3.8.5
      - name: Run browser flows
        run: |
          npm exec --prefix ui -- playwright install --with-deps chromium
          npm --prefix ui run test:e2e
      - name: Pack the reviewed package
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish the reviewed tarball with provenance and the right channel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.npmTag }}
        run: |
          if npm view "mcp-ssh-manager@$VERSION" version >/dev/null 2>&1; then
            EXPECTED=$(npm view "mcp-ssh-manager@$VERSION" dist.integrity)
            ACTUAL=$(node -e 'const fs=require("fs"),crypto=require("crypto");console.log("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$RUNNER_TEMP/mcp-ssh-manager-$VERSION.tgz")
            test "$ACTUAL" = "$EXPECTED" || { echo 'Published version differs from the reviewed tarball; refusing to attest it.'; exit 1; }
            echo "Identical version already published; preserving dist-tags."
          else
            npm publish "$RUNNER_TEMP/mcp-ssh-manager-$VERSION.tgz" --provenance --access public --tag "$NPM_TAG"
          fi
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - name: Attest the actual tarball
        uses: actions/attest-sbom@10926c72720ffc3f7b666661c8e55b1344e2a365 # v2
        with:
          subject-path: '${{ runner.temp }}/mcp-ssh-manager-${{ steps.version.outputs.version }}.tgz'
          sbom-path: sbom.cyclonedx.json
      # Keep GitHub releases private until all desktop assets pass validation.
      - name: Prepare a draft GitHub release with SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --draft --latest=false "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" sbom.cyclonedx.json --clobber
      # Produce a reviewed formula update, never push a new unchecked commit
      # onto protected main. RC runs must not touch the stable formula at all.
      - name: Prepare stable Homebrew update for a pull request
        if: steps.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://registry.npmjs.org/mcp-ssh-manager/-/mcp-ssh-manager-${VERSION}.tgz"
          curl --retry 12 --retry-all-errors --retry-delay 5 -fsL "$URL" -o "$RUNNER_TEMP/published.tgz"
          SHA=$(shasum -a 256 "$RUNNER_TEMP/published.tgz" | cut -d' ' -f1)
          sed -i -E "s|url \"https://registry.npmjs.org/mcp-ssh-manager/-/mcp-ssh-manager-[^\"]+\"|url \"$URL\"|" Formula/ssh-manager.rb
          sed -i -E "s|sha256 \"[a-f0-9]+\"|sha256 \"$SHA\"|" Formula/ssh-manager.rb
          git diff -- Formula/ssh-manager.rb > homebrew-update.patch
          echo 'Homebrew update is ready in the artifact. Apply via a pull request after desktop release validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the stable Homebrew patch
        if: steps.version.outputs.prerelease == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-update
          path: homebrew-update.patch
