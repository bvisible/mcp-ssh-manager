<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH Manager — control plane</title>
<style>
  :root {
    --ground: #f6f7f9; --surface: #fff; --sunk: #edeff3;
    --line: #d8dde5; --line-soft: #e6eaf0;
    --ink: #171c24; --ink-soft: #48525f; --ink-faint: #74808f;
    --accent: #22637f; --accent-soft: #e2edf2;
    --danger: #a2453b; --danger-soft: #f6e7e5;
    --ok: #3f6e52; --ok-soft: #e6efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #10141a; --surface: #171c24; --sunk: #1d232c;
      --line: #2c3542; --line-soft: #232a34;
      --ink: #e7ecf2; --ink-soft: #a8b3c1; --ink-faint: #778391;
      --accent: #6fb4d4; --accent-soft: #1b2b35;
      --danger: #d9776b; --danger-soft: #2c1e1c;
      --ok: #7fb394; --ok-soft: #1b2620;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  header {
    padding: 20px 28px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    background: var(--surface);
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .live {
    font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-faint);
    display: flex; align-items: center; gap: 7px; margin-left: auto;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--danger); }

  main { max-width: 1000px; margin: 0 auto; padding: 26px 28px 80px; }

  h2 {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 14px;
    font-family: ui-monospace, monospace; font-weight: 500;
  }
  section { margin-bottom: 40px; }

  .empty {
    color: var(--ink-faint); font-size: 14px; padding: 20px 0;
    border-top: 1px solid var(--line-soft);
  }

  /* pending approvals */
  .req {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px; padding: 18px 20px; margin-bottom: 12px;
  }
  .req.destructive { border-left-color: var(--danger); background: var(--danger-soft); }
  .req-head {
    display: flex; align-items: baseline; gap: 10px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .tool { font-weight: 600; font-size: 15px; }
  .target { color: var(--ink-soft); font-size: 14px; }
  .badge {
    font-family: ui-monospace, monospace; font-size: 10px;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 3px;
    background: var(--danger); color: var(--surface); font-weight: 700;
  }
  .waiting { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .cmd {
    background: var(--sunk); border-radius: 3px; padding: 11px 13px;
    font-family: ui-monospace, monospace; font-size: 13px;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    margin-bottom: 14px;
  }
  details { margin-bottom: 14px; }
  summary { cursor: pointer; font-size: 13px; color: var(--ink-faint); }
  details pre {
    margin: 10px 0 0; background: var(--sunk); border-radius: 3px;
    padding: 11px 13px; font-size: 12px; overflow-x: auto;
  }
  .actions { display: flex; gap: 10px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600;
    padding: 8px 18px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  button:hover { border-color: var(--ink-faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.allow { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.deny { background: var(--danger); border-color: var(--danger); color: #fff; }
  button[disabled] { opacity: .5; cursor: default; }

  /* tabs */
  nav.tabs { display: flex; gap: 4px; margin-left: 24px; }
  nav.tabs button {
    font: inherit; font-size: 13px; font-weight: 500;
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 6px 10px; cursor: pointer; color: var(--ink-faint); border-radius: 0;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.tabs button .count {
    font-family: ui-monospace, monospace; font-size: 10px;
    background: var(--danger); color: #fff; border-radius: 8px;
    padding: 1px 6px; margin-left: 6px;
  }
  .panel[hidden] { display: none; }

  /* servers */
  .srv {
    display: grid; grid-template-columns: 1fr auto; gap: 14px;
    padding: 13px 0; border-bottom: 1px solid var(--line-soft); align-items: center;
  }
  .srv .id { font-weight: 600; }
  .srv .conn { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--ink-soft); }
  .srv .tags { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .tag {
    font-family: ui-monospace, monospace; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; background: var(--sunk); color: var(--ink-soft);
  }
  .tag.mode { background: var(--accent-soft); color: var(--accent); }
  .tag.approval { background: var(--danger-soft); color: var(--danger); }
  .srv .row-actions { display: flex; gap: 8px; }
  button.small { font-size: 13px; padding: 5px 12px; font-weight: 500; }

  form.server-form {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; padding: 20px; margin-bottom: 20px;
  }
  form.server-form h3 { margin: 0 0 16px; font-size: 15px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  label { display: block; font-size: 12px; color: var(--ink-faint); margin-bottom: 5px; }
  input, select {
    font: inherit; font-size: 14px; width: 100%;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--ground); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
  .form-actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .msg { font-size: 13px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }

  /* live streams */
  .stream {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; margin-bottom: 10px; overflow: hidden;
  }
  .stream.running { border-left: 3px solid var(--ok); }
  .stream.done { border-left: 3px solid var(--line); }
  .stream-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 11px 14px; cursor: pointer; flex-wrap: wrap;
  }
  .stream-head .srv-name { font-weight: 600; font-size: 14px; }
  .stream-head .cmdline {
    font-family: ui-monospace, monospace; font-size: 12.5px;
    color: var(--ink-soft); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  .stream-head .state {
    font-family: ui-monospace, monospace; font-size: 10px;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 3px; white-space: nowrap;
  }
  .state.running { background: var(--ok-soft); color: var(--ok); }
  .state.ok { background: var(--sunk); color: var(--ink-faint); }
  .state.bad { background: var(--danger-soft); color: var(--danger); }
  .stream-out {
    margin: 0; padding: 12px 14px; background: var(--sunk);
    font-family: ui-monospace, monospace; font-size: 12.5px; line-height: 1.5;
    max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    border-top: 1px solid var(--line-soft);
  }
  .stream-out[hidden] { display: none; }

  /* timeline */
  .row {
    display: grid; grid-template-columns: 74px 1fr auto;
    gap: 14px; padding: 9px 0; align-items: baseline;
    border-bottom: 1px solid var(--line-soft); font-size: 14px;
  }
  .time { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .what { min-width: 0; }
  .what .server { color: var(--ink-faint); font-size: 13px; }
  .what .detail {
    font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--ink-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .verdict {
    font-family: ui-monospace, monospace; font-size: 11px;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 3px; white-space: nowrap;
  }
  .verdict.allowed { background: var(--ok-soft); color: var(--ok); }
  .verdict.denied { background: var(--danger-soft); color: var(--danger); }
</style>
</head>
<body>

<header>
  <h1>SSH Manager</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-panel="servers" aria-selected="true">Servers</button>
    <button role="tab" data-panel="queue" aria-selected="false">Waiting<span class="count" id="pendingCount" hidden>0</span></button>
    <button role="tab" data-panel="live" aria-selected="false">Live<span class="count" id="liveCount" hidden>0</span></button>
    <button role="tab" data-panel="activity" aria-selected="false">Activity</button>
  </nav>
  <span class="live"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
</header>

<main>
  <div class="panel" id="panel-servers">
    <section>
      <h2>Your servers</h2>
      <form class="server-form" id="serverForm">
        <h3 id="formTitle">Add a server</h3>
        <div class="fields">
          <div><label for="f-name">Name</label><input id="f-name" name="name" placeholder="prod" required></div>
          <div><label for="f-host">Host</label><input id="f-host" name="host" placeholder="prod.internal" required></div>
          <div><label for="f-user">User</label><input id="f-user" name="user" placeholder="deploy"></div>
          <div><label for="f-port">Port</label><input id="f-port" name="port" type="number" placeholder="22"></div>
          <div><label for="f-keyPath">SSH key path</label><input id="f-keyPath" name="keyPath" placeholder="~/.ssh/id_ed25519"></div>
          <div><label for="f-password">Password</label><input id="f-password" name="password" type="password" placeholder="leave blank to keep"></div>
          <div><label for="f-sudoPassword">Sudo password</label><input id="f-sudoPassword" name="sudoPassword" type="password" placeholder="leave blank to keep"></div>
          <div><label for="f-mode">Security mode</label><select id="f-mode" name="mode">
            <option value="">unrestricted</option><option value="readonly">readonly</option><option value="restricted">restricted</option>
          </select></div>
          <div><label for="f-approval">Ask me before</label><select id="f-approval" name="approval">
            <option value="">never</option><option value="destructive">destructive actions</option><option value="always">everything</option>
          </select></div>
        </div>
        <p class="hint">Secrets are encrypted before they touch the disk. Editing a server and leaving a password blank keeps the stored one.</p>
        <div class="form-actions">
          <button type="submit" class="allow">Save</button>
          <button type="button" id="cancelEdit" hidden>Cancel</button>
          <span class="msg" id="formMsg"></span>
        </div>
      </form>
      <div id="servers"></div>
    </section>
  </div>

  <div class="panel" id="panel-queue" hidden>
    <section>
      <h2>Waiting for you</h2>
      <div id="pending"></div>
    </section>
  </div>

  <div class="panel" id="panel-live" hidden>
    <section>
      <h2>What your agents are running, as it happens</h2>
      <div id="streams"></div>
    </section>
  </div>

  <div class="panel" id="panel-activity" hidden>
    <section>
      <h2>What your agents did</h2>
      <div id="timeline"></div>
    </section>
  </div>
</main>

<script>
  const token = new URLSearchParams(location.search).get('token');
  const pendingEl = document.getElementById('pending');
  const timelineEl = document.getElementById('timeline');
  const dot = document.getElementById('dot');
  const conn = document.getElementById('conn');

  const pending = new Map();
  let timeline = [];

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const clock = ts => {
    const d = new Date(ts);
    return isNaN(d) ? '' : d.toTimeString().slice(0, 8);
  };

  function renderPending() {
    const badge = document.getElementById('pendingCount');
    badge.textContent = String(pending.size);
    badge.hidden = pending.size === 0;
    if (pending.size === 0) {
      pendingEl.innerHTML = '<p class="empty">Nothing waiting. Actions that need approval will appear here and stay until you decide.</p>';
      return;
    }
    pendingEl.innerHTML = [...pending.values()].map(r => `
      <div class="req ${r.destructive ? 'destructive' : ''}">
        <div class="req-head">
          <span class="tool">${esc(r.tool)}</span>
          <span class="target">${esc(r.user || '')}@${esc(r.host || '')} · ${esc(r.server)}</span>
          ${r.destructive ? '<span class="badge">destructive</span>' : ''}
          <span class="waiting" data-since="${r.receivedAt}">waiting</span>
        </div>
        ${r.command ? `<div class="cmd">${esc(r.command)}</div>` : ''}
        <details><summary>Arguments</summary><pre>${esc(JSON.stringify(r.args, null, 2))}</pre></details>
        <div class="actions">
          <button class="deny" data-id="${esc(r.id)}" data-decision="deny">Refuse</button>
          <button class="allow" data-id="${esc(r.id)}" data-decision="allow">Approve</button>
        </div>
      </div>`).join('');
  }

  function renderTimeline() {
    if (timeline.length === 0) {
      timelineEl.innerHTML = '<p class="empty">Nothing yet. Approvals show up here, and so does every audited action once a server has AUDIT_LOG set.</p>';
      return;
    }
    timelineEl.innerHTML = timeline.slice().reverse().slice(0, 200).map(e => {
      const detail = e.command || (e.args ? JSON.stringify(e.args) : '');
      return `<div class="row">
        <span class="time">${esc(clock(e.ts))}</span>
        <span class="what">
          <strong>${esc(e.tool || '—')}</strong> <span class="server">${esc(e.server || '')}</span>
          ${detail ? `<div class="detail">${esc(detail)}</div>` : ''}
        </span>
        <span class="verdict ${e.allowed ? 'allowed' : 'denied'}">${e.allowed ? 'ran' : 'refused'}</span>
      </div>`;
    }).join('');
  }

  // Live "waiting 12s" counters, so a request that has been sitting there looks
  // like it has been sitting there.
  setInterval(() => {
    for (const el of document.querySelectorAll('.waiting[data-since]')) {
      const s = Math.round((Date.now() - Number(el.dataset.since)) / 1000);
      el.textContent = `waiting ${s}s`;
    }
  }, 1000);

  pendingEl.addEventListener('click', async event => {
    const button = event.target.closest('button[data-id]');
    if (!button) return;
    for (const b of button.parentElement.querySelectorAll('button')) b.disabled = true;
    try {
      await fetch(`/api/decide?token=${encodeURIComponent(token)}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ id: button.dataset.id, decision: button.dataset.decision }),
      });
    } catch {
      for (const b of button.parentElement.querySelectorAll('button')) b.disabled = false;
    }
  });

  // --- tabs ---
  const tabs = [...document.querySelectorAll('nav.tabs button')];
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t === tab)));
    for (const panel of document.querySelectorAll('.panel')) {
      panel.hidden = panel.id !== `panel-${tab.dataset.panel}`;
    }
  }));

  // --- servers ---
  const serversEl = document.getElementById('servers');
  const form = document.getElementById('serverForm');
  const formTitle = document.getElementById('formTitle');
  const formMsg = document.getElementById('formMsg');
  const cancelEdit = document.getElementById('cancelEdit');
  let servers = [];

  function renderServers() {
    if (servers.length === 0) {
      serversEl.innerHTML = '<p class="empty">No server in the vault yet. Add one above, or run <code>ssh-manager vault import</code> to bring over what is already in your .env.</p>';
      return;
    }
    serversEl.innerHTML = servers.map(s => {
      const tags = [];
      if (s.mode && s.mode !== 'unrestricted') tags.push(`<span class="tag mode">${esc(s.mode)}</span>`);
      if (s.approval && s.approval !== 'never') tags.push(`<span class="tag approval">asks: ${esc(s.approval)}</span>`);
      tags.push(`<span class="tag">${s.keyPath ? 'ssh key' : (s.hasPassword ? 'password' : 'no credential')}</span>`);
      if (s.hasSudoPassword) tags.push('<span class="tag">sudo</span>');
      return `<div class="srv">
        <div>
          <div class="id">${esc(s.name)}</div>
          <div class="conn">${esc(s.user || '?')}@${esc(s.host || '?')}:${esc(s.port || 22)}</div>
          <div class="tags">${tags.join('')}</div>
        </div>
        <div class="row-actions">
          <button class="small" data-edit="${esc(s.name)}">Edit</button>
          <button class="small deny" data-delete="${esc(s.name)}">Delete</button>
        </div>
      </div>`;
    }).join('');
  }

  function fillForm(server) {
    form.reset();
    formMsg.textContent = '';
    if (!server) {
      formTitle.textContent = 'Add a server';
      cancelEdit.hidden = true;
      form.elements.name.readOnly = false;
      return;
    }
    formTitle.textContent = `Edit ${server.name}`;
    cancelEdit.hidden = false;
    // The name is the key in the vault; changing it would create a second entry
    // rather than rename one.
    form.elements.name.readOnly = true;
    for (const field of ['name', 'host', 'user', 'port', 'keyPath', 'mode', 'approval']) {
      if (server[field] !== undefined) form.elements[field].value = server[field];
    }
  }

  serversEl.addEventListener('click', async event => {
    const edit = event.target.closest('button[data-edit]');
    if (edit) {
      fillForm(servers.find(s => s.name === edit.dataset.edit));
      form.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
    const del = event.target.closest('button[data-delete]');
    if (!del) return;
    // Two clicks, no modal: a browser confirm() would freeze the automation
    // this page is tested with, and a second click is enough friction.
    if (del.dataset.armed !== 'yes') {
      del.dataset.armed = 'yes';
      del.textContent = 'Really delete?';
      // 10s, not 4: the window has to outlast someone actually reading the
      // question and glancing at which server the row belongs to.
      setTimeout(() => { del.dataset.armed = ''; del.textContent = 'Delete'; }, 10000);
      return;
    }
    await fetch(`/api/servers?token=${encodeURIComponent(token)}&name=${encodeURIComponent(del.dataset.delete)}`, { method: 'DELETE' });
    await loadServers();
  });

  cancelEdit.addEventListener('click', () => fillForm(null));

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const payload = {};
    for (const [key, value] of new FormData(form)) if (value !== '') payload[key] = value;
    if (payload.port) payload.port = Number(payload.port);

    const res = await fetch(`/api/servers?token=${encodeURIComponent(token)}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      formMsg.textContent = body.error || 'Could not save';
      formMsg.className = 'msg error';
      return;
    }
    formMsg.textContent = `Saved ${body.name}`;
    formMsg.className = 'msg ok';
    fillForm(null);
    await loadServers();
  });

  async function loadServers() {
    const res = await fetch(`/api/servers?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    servers = data.servers || [];
    renderServers();
  }

  // --- live streams ---
  const streamsEl = document.getElementById('streams');
  const liveCount = document.getElementById('liveCount');
  const streams = new Map();
  const expanded = new Set();

  function renderStreams() {
    const all = [...streams.values()].reverse();
    const running = all.filter(s => s.code === null).length;
    liveCount.textContent = String(running);
    liveCount.hidden = running === 0;

    if (all.length === 0) {
      streamsEl.innerHTML = '<p class="empty">Nothing yet. Commands your agents run appear here while they run, output included.</p>';
      return;
    }
    streamsEl.innerHTML = all.map(s => {
      const isRunning = s.code === null;
      const state = isRunning ? '<span class="state running">running</span>'
        : `<span class="state ${s.code === 0 ? 'ok' : 'bad'}">exit ${s.code}</span>`;
      const open = expanded.has(s.id) || isRunning;
      return `<div class="stream ${isRunning ? 'running' : 'done'}">
        <div class="stream-head" data-toggle="${esc(s.id)}">
          <span class="srv-name">${esc(s.server)}</span>
          <span class="cmdline">${esc(s.command)}</span>
          ${state}
        </div>
        <pre class="stream-out" ${open ? '' : 'hidden'} data-out="${esc(s.id)}">${esc(s.scrollback || '')}</pre>
      </div>`;
    }).join('');

    // Keep a running command scrolled to its newest output, the way a terminal
    // does — otherwise a long command scrolls away from what matters.
    for (const s of all) {
      if (s.code !== null) continue;
      const out = streamsEl.querySelector(`[data-out="${CSS.escape(s.id)}"]`);
      if (out) out.scrollTop = out.scrollHeight;
    }
  }

  streamsEl.addEventListener('click', event => {
    const head = event.target.closest('[data-toggle]');
    if (!head) return;
    const id = head.dataset.toggle;
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderStreams();
  });

  function applyStreamEvent(event) {
    if (event.type === 'start') {
      streams.set(event.id, { id: event.id, server: event.server, command: event.command, scrollback: '', code: null });
    } else if (event.type === 'data') {
      const s = streams.get(event.id);
      if (s) {
        s.scrollback += event.chunk;
        if (s.scrollback.length > 65536) s.scrollback = s.scrollback.slice(-65536);
      }
    } else if (event.type === 'end') {
      const s = streams.get(event.id);
      if (s) s.code = event.code;
    }
    renderStreams();
  }

  async function loadStreams() {
    const res = await fetch(`/api/streams?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    streams.clear();
    for (const s of (data.streams || []).reverse()) streams.set(s.id, s);
    renderStreams();
  }

  async function load() {
    const res = await fetch(`/api/state?token=${encodeURIComponent(token)}`);
    const state = await res.json();
    pending.clear();
    for (const r of state.pending) pending.set(r.id, { ...r, receivedAt: Date.now() - (r.waitingMs || 0) });
    timeline = state.timeline || [];
    renderPending();
    renderTimeline();
    await loadServers();
    await loadStreams();
  }

  function connect() {
    const source = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
    source.onopen = () => { dot.classList.remove('off'); conn.textContent = 'live'; };
    source.onerror = () => { dot.classList.add('off'); conn.textContent = 'reconnecting'; };
    source.onmessage = event => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'pending') {
        pending.set(msg.request.id, { ...msg.request, receivedAt: Date.now() });
        renderPending();
      } else if (msg.type === 'resolved' || msg.type === 'expired') {
        pending.delete(msg.id);
        renderPending();
      } else if (msg.type === 'timeline') {
        timeline.push(msg.entry);
        renderTimeline();
      } else if (msg.type === 'servers') {
        loadServers();
      } else if (msg.type === 'stream') {
        applyStreamEvent(msg.event);
      }
    };
  }

  load().then(connect).catch(() => { conn.textContent = 'failed'; dot.classList.add('off'); });
</script>
</body>
</html>
